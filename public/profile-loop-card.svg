  <title id="loop-card-title">Loop 01 — Endless Second Ring</title>
  <desc id="loop-card-desc">A dark cinematic card for Loop 01, a 48-second generative Beijing night drive, with a ledger-like skyline and one warm-white road marking converging on a single vermilion vanishing-point node.</desc>
